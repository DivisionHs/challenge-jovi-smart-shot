<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JOVI Smart Shot - Compartilhar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/compartilhar.css">

</head>


<body>

    <!-- SPRITE DE ÍCONES SVG (embutido, sem dependência externa) -->
    <svg style="display: none;">

        <symbol id="icon-arrow-left" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
        </symbol>

        <symbol id="icon-image" viewBox="0 0 16 16">
            <path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0"/>
            <path d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1z"/>
        </symbol>

        <symbol id="icon-download" viewBox="0 0 16 16">
            <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"/>
            <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708z"/>
        </symbol>

        <symbol id="icon-share-fill" viewBox="0 0 16 16">
            <path d="M11 2.5a2.5 2.5 0 1 1 .603 1.628l-6.718 3.12a2.5 2.5 0 0 1 0 1.504l6.718 3.12a2.5 2.5 0 1 1-.488.876l-6.718-3.12a2.5 2.5 0 1 1 0-3.256l6.718-3.12A2.5 2.5 0 0 1 11 2.5"/>
        </symbol>

        <symbol id="icon-info-circle-fill" viewBox="0 0 16 16">
            <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16m.93-9.412-1 4.705c-.07.34.029.533.304.533.194 0 .487-.07.686-.246l-.088.416c-.287.346-.92.598-1.465.598-.703 0-1.002-.422-.808-1.319l.738-3.468c.064-.293.006-.399-.287-.47l-.451-.081.082-.381 2.29-.287zM8 5.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2"/>
        </symbol>

    </svg>

    <main class="pagina-compartilhar container">


        <!-- TOPO -->

        <header class="topo-compartilhar d-flex align-items-center justify-content-center gap-2">

            <button
                class="voltar-compartilhar"
                type="button"
                onclick="window.location.href='preview.html'">

                <svg class="icone-svg" width="1em" height="1em" fill="currentColor"><use href="#icon-arrow-left"></use></svg>

            </button>


            <div class="logo-compartilhar">

                <span class="logo-jovi">
                    JOVI
                </span>

                <span class="logo-smart">
                    Smart Shot
                </span>

            </div>

        </header>



        <!-- CONTEÚDO -->

        <section class="conteudo-compartilhar">


            <!-- ÍCONE -->

            <div class="icone-compartilhar d-flex align-items-center justify-content-center rounded-circle mx-auto">

                <span>
                    ✓
                </span>

            </div>



            <!-- TÍTULO -->

            <h1>
                Sua foto está pronta!
            </h1>


            <p class="descricao-compartilhar">

                Escolha como deseja guardar ou
                compartilhar sua foto.

            </p>



            <!-- PRÉVIA DA FOTO -->

            <div class="foto-compartilhar overflow-hidden position-relative">

                <img
                    id="foto-compartilhar"
                    src=""
                    alt="Foto capturada pelo JOVI Smart Shot">


                <div
                    id="sem-foto"
                    class="sem-foto">

                    <span>
                        <svg class="icone-svg" width="1em" height="1em" fill="currentColor"><use href="#icon-image"></use></svg>
                    </span>

                    <p>
                        Foto não encontrada.
                    </p>

                </div>

            </div>



            <!-- OPÇÕES -->

            <div class="opcoes-compartilhar d-flex flex-column gap-2">


                <!-- SALVAR -->

                <button
                    id="salvar"
                    class="opcao"
                    type="button">

                    <span class="icone-opcao">
                        <svg class="icone-svg" width="1em" height="1em" fill="currentColor"><use href="#icon-download"></use></svg>
                    </span>

                    <span class="texto-opcao">

                        <strong>
                            Salvar na galeria
                        </strong>

                        <small>
                            Guarde a foto no seu dispositivo
                        </small>

                    </span>

                </button>



                <!-- COMPARTILHAR -->

                <button
                    id="compartilhar"
                    class="opcao"
                    type="button">

                    <span class="icone-opcao">
                        <svg class="icone-svg" width="1em" height="1em" fill="currentColor"><use href="#icon-share-fill"></use></svg>
                    </span>

                    <span class="texto-opcao">

                        <strong>
                            Compartilhar
                        </strong>

                        <small>
                            Envie para outras pessoas ou aplicativos
                        </small>

                    </span>

                </button>


            </div>



            <!-- NOVA FOTO -->

            <button
                class="nova-foto"
                type="button"
                onclick="window.location.href='captura.html'">

                Tirar outra foto

            </button>



            <!-- FINALIZAÇÃO -->

            <button
                class="finalizar"
                type="button"
                onclick="window.location.href='../index.html'">

                Finalizar

            </button>



            <!-- AVISO -->

            <div class="aviso-compartilhar align-items-center gap-2">

                <span>
                    <svg class="icone-svg" width="1em" height="1em" fill="currentColor"><use href="#icon-info-circle-fill"></use></svg>
                </span>

                <p>
                    Você escolhe quando e onde compartilhar
                    suas fotos.
                </p>

            </div>


        </section>


    </main>


    <script src="../assets/js/compartilhar.js"></script>

</body>

</html>
