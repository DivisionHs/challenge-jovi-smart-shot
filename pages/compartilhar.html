<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JOVI Smart Shot - Compartilhar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/compartilhar.css">

</head>


<body>

    <main class="pagina-compartilhar container">


        <!-- TOPO -->

        <header class="topo-compartilhar d-flex align-items-center justify-content-center gap-2">

            <button
                class="voltar-compartilhar"
                type="button"
                onclick="window.location.href='preview.html'">

                <i class="bi bi-arrow-left"></i>

            </button>


            <div class="logo-compartilhar">

                <span class="logo-jovi">
                    JOVI
                </span>

                <span class="logo-smart">
                    Smart Shot
                </span>

            </div>

        </header>



        <!-- CONTEÚDO -->

        <section class="conteudo-compartilhar">


            <!-- ÍCONE -->

            <div class="icone-compartilhar d-flex align-items-center justify-content-center rounded-circle mx-auto">

                <span>
                    ✓
                </span>

            </div>



            <!-- TÍTULO -->

            <h1>
                Sua foto está pronta!
            </h1>


            <p class="descricao-compartilhar">

                Escolha como deseja guardar ou
                compartilhar sua foto.

            </p>



            <!-- PRÉVIA DA FOTO -->

            <div class="foto-compartilhar overflow-hidden position-relative">

                <img
                    id="foto-compartilhar"
                    src=""
                    alt="Foto capturada pelo JOVI Smart Shot">


                <div
                    id="sem-foto"
                    class="sem-foto">

                    <span>
                        <i class="bi bi-image"></i>
                    </span>

                    <p>
                        Foto não encontrada.
                    </p>

                </div>

            </div>



            <!-- OPÇÕES -->

            <div class="opcoes-compartilhar d-flex flex-column gap-2">


                <!-- SALVAR -->

                <button
                    id="salvar"
                    class="opcao"
                    type="button">

                    <span class="icone-opcao">
                        <i class="bi bi-download"></i>
                    </span>

                    <span class="texto-opcao">

                        <strong>
                            Salvar na galeria
                        </strong>

                        <small>
                            Guarde a foto no seu dispositivo
                        </small>

                    </span>

                </button>



                <!-- COMPARTILHAR -->

                <button
                    id="compartilhar"
                    class="opcao"
                    type="button">

                    <span class="icone-opcao">
                        <i class="bi bi-share-fill"></i>
                    </span>

                    <span class="texto-opcao">

                        <strong>
                            Compartilhar
                        </strong>

                        <small>
                            Envie para outras pessoas ou aplicativos
                        </small>

                    </span>

                </button>


            </div>



            <!-- NOVA FOTO -->

            <button
                class="nova-foto"
                type="button"
                onclick="window.location.href='captura.html'">

                Tirar outra foto

            </button>



            <!-- FINALIZAÇÃO -->

            <button
                class="finalizar"
                type="button"
                onclick="window.location.href='../index.html'">

                Finalizar

            </button>



            <!-- AVISO -->

            <div class="aviso-compartilhar align-items-center gap-2">

                <span>
                    <i class="bi bi-info-circle-fill"></i>
                </span>

                <p>
                    Você escolhe quando e onde compartilhar
                    suas fotos.
                </p>

            </div>


        </section>


    </main>


    <script src="../assets/js/compartilhar.js"></script>

</body>

</html>
