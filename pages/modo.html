<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JOVI Smart Shot - Escolha o Modo</title>

    <!-- CSS específico desta página -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/modo.css">

</head>


<body>

    <!-- SPRITE DE ÍCONES SVG (embutido, sem dependência externa) -->
    <svg style="display: none;">

        <symbol id="icon-arrow-left" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
        </symbol>

        <symbol id="icon-camera-fill" viewBox="0 0 16 16">
            <path d="M10.5 8.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/>
            <path d="M2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.172a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 9.172 2H6.828a2 2 0 0 0-1.414.586l-.828.828A2 2 0 0 1 3.172 4zm.5 2a.5.5 0 1 1 0-1 .5.5 0 0 1 0 1m9 2.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0"/>
        </symbol>

        <symbol id="icon-info-circle-fill" viewBox="0 0 16 16">
            <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16m.93-9.412-1 4.705c-.07.34.029.533.304.533.194 0 .487-.07.686-.246l-.088.416c-.287.346-.92.598-1.465.598-.703 0-1.002-.422-.808-1.319l.738-3.468c.064-.293.006-.399-.287-.47l-.451-.081.082-.381 2.29-.287zM8 5.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2"/>
        </symbol>

    </svg>

    <main class="pagina-modo container">


        <!-- TOPO -->

        <header class="topo-modo d-flex align-items-center justify-content-center gap-2">

            <button
                class="voltar-modo"
                type="button"
                onclick="window.location.href='../index.html'">

                <svg class="icone-svg" width="1em" height="1em" fill="currentColor"><use href="#icon-arrow-left"></use></svg>

            </button>


            <div class="logo-modo">

                <span class="logo-jovi">
                    JOVI
                </span>

                <span class="logo-smart">
                    Smart Shot
                </span>

            </div>

        </header>



        <!-- TÍTULO -->

        <section class="titulo-modo">

            <h1>
                Escolha o Modo Ideal
            </h1>

            <p>
                Selecione o tipo de foto para obter
                orientações personalizadas em tempo real.
            </p>

        </section>



        <!-- MODOS -->

        <section class="modos">


            <!-- RETRATO -->

            <button
                class="modo d-flex flex-column align-items-center justify-content-center text-center"
                type="button"
                data-modo="retrato"
                onclick="selecionarModo(this)">

                <span class="check">
                    ✓
                </span>


                <img
                    src="../assets/images/icone-retrato.png"
                    alt="Retrato">


                <h2>
                    Retrato
                </h2>


                <p>
                    Dicas para destacar o rosto,
                    luz e distância.
                </p>

            </button>



            <!-- PAISAGEM -->

            <button
                class="modo d-flex flex-column align-items-center justify-content-center text-center"
                type="button"
                data-modo="paisagem"
                onclick="selecionarModo(this)">

                <span class="check">
                    ✓
                </span>


                <img
                    src="../assets/images/icone-paisagem.png"
                    alt="Paisagem">


                <h2>
                    Paisagem
                </h2>


                <p>
                    Orientações para capturar o
                    horizonte, luz e enquadramento.
                </p>

            </button>



            <!-- GRUPO -->

            <button
                class="modo d-flex flex-column align-items-center justify-content-center text-center"
                type="button"
                data-modo="grupo"
                onclick="selecionarModo(this)">

                <span class="check">
                    ✓
                </span>


                <img
                    src="../assets/images/icone-grupo.png"
                    alt="Grupo">


                <h2>
                    Grupo
                </h2>


                <p>
                    Dicas para o posicionamento
                    e enquadramento.
                </p>

            </button>



            <!-- PET -->

            <button
                class="modo d-flex flex-column align-items-center justify-content-center text-center"
                type="button"
                data-modo="pet"
                onclick="selecionarModo(this)">

                <span class="check">
                    ✓
                </span>


                <img
                    src="../assets/images/icone-pet.png"
                    alt="Pet">


                <h2>
                    Pet
                </h2>


                <p>
                    Orientações para capturar
                    movimento, foco e enquadramento.
                </p>

            </button>


        </section>



        <!-- CONTINUAR -->

        <button
            id="continuar-modo"
            class="continuar-modo d-flex align-items-center justify-content-center gap-3 rounded-pill"
            type="button"
            disabled
            onclick="window.location.href='permissao.html'">

            <span class="camera-modo">
                <svg class="icone-svg" width="1em" height="1em" fill="currentColor"><use href="#icon-camera-fill"></use></svg>
            </span>

            <span>
                Continuar
            </span>

        </button>



        <!-- VOLTAR -->

        <button
            class="voltar-texto-modo"
            type="button"
            onclick="window.location.href='../index.html'">

            Voltar

        </button>



        <!-- AVISO -->

        <div class="aviso-modo align-items-center gap-2">

            <span class="aviso-icon-modo">
                <svg class="icone-svg" width="1em" height="1em" fill="currentColor"><use href="#icon-info-circle-fill"></use></svg>
            </span>

            <p>
                As orientações mudam conforme o modo
                escolhido.
            </p>

        </div>


    </main>



    <script>

        function selecionarModo(elemento) {

            const modos = document.querySelectorAll(".modo");

            modos.forEach(function(modo) {

                modo.classList.remove("selecionado");

            });

            elemento.classList.add("selecionado");

            sessionStorage.setItem("modoSmartShot", elemento.dataset.modo);

            document.getElementById("continuar-modo").disabled = false;

        }

        // Nenhum modo vem selecionado por padrao: o usuario precisa
        // escolher um card antes de poder continuar.
        sessionStorage.removeItem("modoSmartShot");

    </script>


</body>

</html>
