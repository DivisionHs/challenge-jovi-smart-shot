<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JOVI Smart Shot - Captura</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/captura.css">

</head>


<body>

    <!-- SPRITE DE ÍCONES SVG (embutido, sem dependência externa) -->
    <svg style="display: none;">

        <symbol id="icon-arrow-left" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
        </symbol>

        <symbol id="icon-camera-video-off" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M10.961 12.365a2 2 0 0 0 .522-1.103l3.11 1.382A1 1 0 0 0 16 11.731V4.269a1 1 0 0 0-1.406-.913l-3.111 1.382A2 2 0 0 0 9.5 3H4.272l.714 1H9.5a1 1 0 0 1 1 1v6a1 1 0 0 1-.144.518zM1.428 4.18A1 1 0 0 0 1 5v6a1 1 0 0 0 1 1h5.014l.714 1H2a2 2 0 0 1-2-2V5c0-.675.334-1.272.847-1.634zM15 11.73l-3.5-1.555v-4.35L15 4.269zm-4.407 3.56-10-14 .814-.58 10 14z"/>
        </symbol>

    </svg>

    <main class="pagina-captura container">


        <!-- TOPO -->

        <header class="topo-captura d-flex align-items-center justify-content-center gap-2">

            <button
                class="voltar-captura"
                type="button"
                onclick="window.location.href='permissao.html'">

                <svg class="icone-svg" width="1em" height="1em" fill="currentColor"><use href="#icon-arrow-left"></use></svg>

            </button>


            <div class="logo-captura">

                <span class="logo-jovi">
                    JOVI
                </span>

                <span class="logo-smart">
                    Smart Shot
                </span>

            </div>

        </header>



        <!-- TÍTULO -->

        <section class="titulo-captura">

            <h1 id="titulo-captura-modo">
                Captura inteligente
            </h1>

            <p id="descricao-captura-modo">
                Posicione a câmera e siga as orientações
                para conseguir uma foto melhor.
            </p>

        </section>



        <!-- ÁREA DA CÂMERA -->

        <section class="area-camera position-relative overflow-hidden">


            <video
                id="camera"
                autoplay
                playsinline>
            </video>


            <!-- MENSAGEM CASO A CÂMERA NÃO ESTEJA DISPONÍVEL -->

            <div
                id="mensagem-camera"
                class="mensagem-camera">

                <span class="icone-camera">
                    <svg class="icone-svg" width="1em" height="1em" fill="currentColor"><use href="#icon-camera-video-off"></use></svg>
                </span>

                <p id="mensagem-camera-texto">
                    Ative o acesso à câmera para
                    começar a captura.
                </p>

                <button
                    id="ativar-camera"
                    type="button">

                    Ativar câmera

                </button>

            </div>


            <!-- GUIA DE ENQUADRAMENTO -->

            <div class="guia-enquadramento">

                <span class="canto canto-superior-esquerdo"></span>
                <span class="canto canto-superior-direito"></span>
                <span class="canto canto-inferior-esquerdo"></span>
                <span class="canto canto-inferior-direito"></span>

            </div>


            <!-- ORIENTAÇÃO -->

            <div
                id="orientacao"
                class="orientacao d-flex align-items-center gap-2 rounded-pill">

                <span id="icone-orientacao">
                    ✓
                </span>

                <span id="texto-orientacao">
                    Enquadramento adequado
                </span>

            </div>


        </section>



        <!-- INDICADORES -->

        <section class="indicadores">


            <div id="indicador-iluminacao" class="indicador">

                <span class="indicador-icone">
                    ☀
                </span>

                <span>
                    Iluminação
                </span>

            </div>


            <div id="indicador-estabilidade" class="indicador">

                <span class="indicador-icone">
                    ◉
                </span>

                <span>
                    Estabilidade
                </span>

            </div>


            <div id="indicador-distancia" class="indicador">

                <span class="indicador-icone">
                    ↔
                </span>

                <span>
                    Distância
                </span>

            </div>


            <div id="indicador-enquadramento" class="indicador">

                <span class="indicador-icone">
                    ⌗
                </span>

                <span>
                    Enquadramento
                </span>

            </div>


        </section>



        <!-- BOTÃO DE CAPTURA -->

        <button
            id="capturar"
            class="botao-capturar d-flex align-items-center justify-content-center gap-3 rounded-pill"
            type="button"
            disabled>

            <span class="icone-captura">
                ●
            </span>

            <span>
                Capturar foto
            </span>

        </button>



        <!-- VOLTAR -->

        <button
            class="voltar-texto-captura"
            type="button"
            onclick="window.location.href='permissao.html'">

            Voltar

        </button>



        <!-- CANVAS INVISÍVEL -->

        <canvas id="canvas"></canvas>


    </main>


    <script src="../assets/js/captura.js"></script>

</body>

</html>
